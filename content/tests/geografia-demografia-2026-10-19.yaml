teste:
  id: geografia-demografia-2026-10-19
  disciplina: Geografia
  titulo: Demografia e evolução da população
  data: 2026-10-19
  dimensao: media
  estado: rascunho
  demonstracao: true
  descricao: Preparação atualizada com os apontamentos e o resumo do manual enviado pela estudante em 17 de outubro de 2026, incluindo o ponto 1 da página 16 (natalidade no mundo).
planeamento:
  antecedencia:
    minimo_dias: 2
    maximo_dias: 2
  duracao_sessao_sugerida_minutos: 25
  roteiro:
    versao: 1
    pausa_minutos: 5
    tarefas:
      - id: tema-demografia-censos
        titulo: Demografia, população absoluta e censos
        descricao: "Lê o resumo e responde sem consultar: o que são demografia, PA e censos? Explica como os censos ajudam a planear escolas e hospitais."
        tema: demografia-censos
        minutos: 10
      - id: tema-crescimento-populacao
        titulo: Três fases e continentes
        descricao: Estuda o esquema das fases. Diz os nomes, as datas (1750 e 1950) e as causas da diminuição da mortalidade. Recorda Ásia e Oceânia e pratica os flashcards.
        tema: crescimento-populacao
        minutos: 15
      - id: tema-movimentos-populacao
        titulo: Imigração, emigração e saldo migratório
        descricao: Usa entrada/saída para distinguir os movimentos. Resolve o cartão com 18 000 imigrantes e 12 500 emigrantes e explica os sinais positivo, negativo e nulo.
        tema: movimentos-populacao
        minutos: 10
      - id: calculos-crescimento
        titulo: Praticar CN, SM e CE
        descricao: Sem consultar, escreve CN = N − M, SM = I − E e CE = CN + SM. Resolve os cartões com CN negativo e o exercício com N = 1200, M = 900, I = 500 e E = 200. Corrige e repete os erros.
        tema: crescimento-populacao
        minutos: 15
      - id: tema-taxas-demograficas
        titulo: Calcular TBN, TBM e TCN
        descricao: Estuda as três fórmulas. Resolve os cartões com PA = 100 000 e os casos de TCN negativa e nula. Escreve sempre ‰ nas taxas e pessoas em CN, SM e CE.
        tema: taxas-demograficas
        minutos: 15
      - id: tema-natalidade-mundo
        titulo: Natalidade elevada e reduzida
        descricao: Observa o esquema da página 16, ponto 1. Diz sem consultar as cinco causas de natalidade reduzida e as cinco de natalidade elevada. Recorda a tendência de diminuição no mundo.
        tema: natalidade-mundo
        minutos: 10
      - id: tema-contrastes-demograficos
        titulo: Comparar Portugal e Angola
        descricao: Compara natalidade, crescimento natural e esperança média de vida nos países desenvolvidos e em desenvolvimento. Pratica os cartões e explica que são tendências gerais.
        tema: contrastes-demograficos
        minutos: 10
      - id: revisao-final
        titulo: Revisão final sem consultar
        descricao: Revê os flashcards marcados «Ainda não sei» e «Quase». Escreve as seis fórmulas, explica as três fases e as causas da natalidade. Confirma as unidades, os censos e os continentes; corrige os erros.
        tema: null
        minutos: 15
temas:
  - id: demografia-censos
    nome: Demografia e censos
    peso: 2
  - id: movimentos-populacao
    nome: Movimentos da população
    peso: 4
  - id: crescimento-populacao
    nome: Crescimento da população
    peso: 5
  - id: contrastes-demograficos
    nome: Contrastes demográficos
    peso: 4
