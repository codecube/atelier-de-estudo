  - id: geo-demografia-27
    tema: taxas-demograficas
    pergunta: Como se calcula a taxa bruta de natalidade?
    resposta: TBN = (N ÷ PA) × 1000.
    explicacao: Divide os nascimentos pela população absoluta e multiplica por 1000; o resultado é em ‰.
    dificuldade: media
