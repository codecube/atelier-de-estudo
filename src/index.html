<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#274c5e" />
    <meta name="description" content="Um atelier calmo para preparar testes com flashcards." />
    <title>Atelier de Estudo 8B</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
    <div class="blueprint-grid" aria-hidden="true"></div>
    <header class="site-header">
      <button class="brand" data-action="home" aria-label="Ir para o início">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
        <span><strong>Atelier</strong><small>de Estudo 8B</small></span>
      </button>
      <div class="header-tools">
        <span class="status-dot"><i></i> Progresso guardado neste dispositivo</span>
        <button class="icon-button" data-action="home" aria-label="Início" title="Início">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9 20v-6h6v6"/></svg>
        </button>
      </div>
    </header>

    <main id="conteudo" tabindex="-1"></main>

    <footer>
      <span>Atelier de Estudo 8B</span>
      <span class="dimension-line" aria-hidden="true"></span>
      <span>feito para aprender com calma</span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
